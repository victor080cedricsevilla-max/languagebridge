workflows:
  ios-simulator:
    name: iOS Simulator Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - api_keys
    scripts:
      - name: Disable Swift Package Manager (unsupported by some plugins)
        script: flutter config --no-enable-swift-package-manager
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Clean CocoaPods state and reinstall
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --verbose
          cd ..
      - name: Build iOS app for Simulator (unsigned)
        script: |
          flutter build ios --debug --simulator --no-codesign --verbose \
            --dart-define=TRANSLATE_API_KEY=$TRANSLATE_API_KEY \
            --dart-define=ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
      - name: Package .app for Appetize.io
        script: |
          cd build/ios/iphonesimulator
          zip -r LanguageBridge-simulator.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/LanguageBridge-simulator.zip

  ios-device-unsigned:
    name: iOS Device Build (Unsigned, for Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - api_keys
    scripts:
      - name: Disable Swift Package Manager (unsupported by some plugins)
        script: flutter config --no-enable-swift-package-manager
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Clean CocoaPods state and reinstall
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --verbose
          cd ..
      - name: Build iOS app for real device (unsigned)
        script: |
          flutter build ios --release --no-codesign --verbose \
            --dart-define=TRANSLATE_API_KEY=$TRANSLATE_API_KEY \
            --dart-define=ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY
      - name: Package as unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r LanguageBridge-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/LanguageBridge-unsigned.ipa
